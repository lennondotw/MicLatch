# SwiftLint Configuration
# https://realm.github.io/SwiftLint/rule-directory.html

# Paths to include during linting
included:
  - MicLatch
  - MicLatchTests

# Paths to exclude during linting
excluded:
  - .build
  - DerivedData
  - Pods
  - Carthage
  - "**/.build"
  - "**/Package.swift"

# Enabled opt-in rules
opt_in_rules:
  - anonymous_argument_in_multiline_closure
  - array_init
  - attributes
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - conditional_returns_on_newline
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - file_name
  - file_name_no_space
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - ibinspectable_in_extension
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - nimble_operator
  - nslocalizedstring_key
  - nslocalizedstring_require_bundle
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - sorted_first_last
  - sorted_imports
  - static_operator
  - strict_fileprivate
  - strong_iboutlet
  - switch_case_on_newline
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# Disabled rules
disabled_rules:
  - todo
  - trailing_comma
  - opening_brace

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: false
  ignores_interpolated_strings: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 100

function_parameter_count:
  warning: 6
  error: 8
  ignores_default_parameters: true

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID
    - OK
    - UI

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - ok
    - x
    - y
    - z
    - i
    - j
    - k
    - to
    - db
    - io

nesting:
  type_level:
    warning: 3
    error: 5
  function_level:
    warning: 3
    error: 5

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

large_tuple:
  warning: 3
  error: 4

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: true

vertical_whitespace:
  max_empty_lines: 2

force_cast: warning
force_try: warning
force_unwrapping: warning

implicitly_unwrapped_optional:
  mode: all_except_iboutlets
  severity: warning

number_separator:
  minimum_length: 5

file_header:
  required_pattern: |
    \/\/
    \/\/  .*\.swift
    \/\/  MicLatch
    \/\/
    \/\/  Copyright © 2026 Mingxuan Wang\. All rights reserved\.
    \/\/

multiline_arguments:
  first_argument_location: next_line
  only_enforce_after_first_closure_on_first_line: true

attributes:
  always_on_same_line:
    - "@IBAction"
    - "@IBOutlet"
    - "@IBDesignable"
    - "@IBInspectable"
    - "@objc"
    - "@GKInspectable"
    - "@Sendable"
  always_on_line_above:
    - "@discardableResult"
    - "@available"
    - "@propertyWrapper"
    - "@resultBuilder"
    - "@MainActor"
    - "@Test"
    - "@Suite"

modifier_order:
  preferred_modifier_order:
    - acl
    - setterACL
    - override
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

# Custom rules
custom_rules:
  no_print_in_production:
    name: "No print() in production code"
    regex: '^\s*print\('
    match_kinds:
      - identifier
    message: "Use os_log or Logger instead of print()"
    severity: warning
    included: "Sources/.*\\.swift"
    excluded: ".*Tests.*\\.swift"

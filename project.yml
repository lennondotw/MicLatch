# yaml-language-server: $schema=https://raw.githubusercontent.com/Kila2/XcodeGen/6e784e280a9e654bddda285fcff28ed23822d729/Assets/json-schema/project.json

name: MicLatch

############################################################
# Options
############################################################

options:
  bundleIdPrefix: sh.lennon
  deploymentTarget:
    macOS: '15.0'
  xcodeVersion: '26.2'
  generateEmptyDirectories: true
  groupSortPosition: top
  createIntermediateGroups: true
  indentWidth: 2
  tabWidth: 2
  usesTabs: false
  postGenCommand: |
    for dir in \
      MicLatch.xcodeproj/project.xcworkspace/xcshareddata \
      "MicLatch.xcodeproj/project.xcworkspace/xcuserdata/${USER}.xcuserdatad"; do
      mkdir -p "$dir"
      WS="$dir/WorkspaceSettings.xcsettings"
      plutil -create xml1 "$WS"
      plutil -insert DerivedDataLocationStyle -string WorkspaceRelativePath "$WS"
      plutil -insert DerivedDataCustomLocation -string .build/DerivedData "$WS"
    done

############################################################
# Settings
############################################################

settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: true
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: true
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ENABLE_TESTABILITY: true
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ''
      SWIFT_OPTIMIZATION_LEVEL: -O
      ENABLE_TESTABILITY: false

############################################################
# Configs
############################################################

configs:
  Debug: debug
  Release: release

############################################################
# Packages
############################################################

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: '2.8.1'

############################################################
# Targets
############################################################

targets:
  # ──────────────────────────────────────────────────────────
  # MicLatch (macOS App)
  # ──────────────────────────────────────────────────────────

  MicLatch:
    type: application
    platform: macOS
    sources:
      - path: MicLatch/Sources
      - path: MicLatch/Resources
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    dependencies:
      - package: Sparkle
    settings:
      base:
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        INFOPLIST_FILE: MicLatch/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MicLatch/Resources/MicLatch.entitlements
        GENERATE_INFOPLIST_FILE: false
        MACOSX_DEPLOYMENT_TARGET: '15.0'
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ''
        PRODUCT_MODULE_NAME: MicLatch
        SPARKLE_PUBLIC_KEY: 'f2ja6L7u2qVK3I2OEj9P5BwjJr/DA98RNYC0yMjLPn8='
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: sh.lennon.MicLatch.debug
          PRODUCT_NAME: 'MicLatch Debug'
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: sh.lennon.MicLatch
          PRODUCT_NAME: MicLatch
    preBuildScripts:
      - name: 'SwiftLint'
        basedOnDependencyAnalysis: false
        shell: /bin/zsh
        script: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --config "${SRCROOT}/.swiftlint.yml" --quiet
          else
            echo "warning: SwiftLint not installed, run 'brew install swiftlint'"
          fi
      - name: 'SwiftFormat'
        basedOnDependencyAnalysis: false
        shell: /bin/zsh
        script: |
          if command -v swiftformat >/dev/null 2>&1; then
            swiftformat "${SRCROOT}/MicLatch" --lint --config "${SRCROOT}/.swiftformat" --quiet
          else
            echo "warning: SwiftFormat not installed, run 'brew install swiftformat'"
          fi

  # ──────────────────────────────────────────────────────────
  # MicLatchTests (macOS Unit Tests)
  # ──────────────────────────────────────────────────────────

  MicLatchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MicLatchTests
    dependencies:
      - target: MicLatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.lennon.MicLatch.tests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Debug:
          TEST_HOST: '$(BUILT_PRODUCTS_DIR)/MicLatch Debug.app/Contents/MacOS/MicLatch Debug'
        Release:
          TEST_HOST: '$(BUILT_PRODUCTS_DIR)/MicLatch.app/Contents/MacOS/MicLatch'

############################################################
# Schemes
############################################################

schemes:
  MicLatch:
    build:
      targets:
        MicLatch: all
        MicLatchTests: [test]
    run:
      config: Debug
      executable: MicLatch
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MicLatchTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
